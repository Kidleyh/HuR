name: Person Tracking Tests

on:
  push:
    paths:
      - "astrolabe/scorers/video/person_tracking/**"
      - "astrolabe/scorers/video/tracklet_stitching/**"
      - "astrolabe/scorers/video/human_anomaly/**"
      - "astrolabe/scorers/video/human_reward/**"
      - "astrolabe/scorers/video/human_temporal/**"
      - "astrolabe/scorers/video/human_temporal_3d/**"
      - "scripts/run_person_tracking.py"
      - "scripts/run_person_preprocessing_pipeline.py"
      - "scripts/run_person_human_anomaly.py"
      - "scripts/run_human_reward.py"
      - "scripts/run_human_reward_pairs.py"
      - "scripts/summarize_human_temporal_pairs.py"
      - "scripts/vbench_human_anomaly_worker.py"
      - "scripts/run_tracklet_stitching.py"
      - "scripts/check_tracking_env.py"
      - "configs/bytetrack_person.yaml"
      - "configs/tracklet_stitching.yaml"
      - "tests/test_person_tracking*.py"
      - "tests/test_person_preprocessing_pipeline.py"
      - "tests/test_human_anomaly*.py"
      - "tests/test_human_reward*.py"
      - "tests/test_human_temporal*.py"
      - "tests/test_tracklet_stitching*.py"
      - "tests/test_track_statistics.py"
      - "requirements-tracking.txt"
      - ".github/workflows/person-tracking-tests.yml"
  pull_request:
    paths:
      - "astrolabe/scorers/video/person_tracking/**"
      - "astrolabe/scorers/video/tracklet_stitching/**"
      - "astrolabe/scorers/video/human_anomaly/**"
      - "astrolabe/scorers/video/human_reward/**"
      - "astrolabe/scorers/video/human_temporal/**"
      - "astrolabe/scorers/video/human_temporal_3d/**"
      - "scripts/run_person_tracking.py"
      - "scripts/run_person_preprocessing_pipeline.py"
      - "scripts/run_person_human_anomaly.py"
      - "scripts/run_human_reward.py"
      - "scripts/run_human_reward_pairs.py"
      - "scripts/summarize_human_temporal_pairs.py"
      - "scripts/vbench_human_anomaly_worker.py"
      - "scripts/run_tracklet_stitching.py"
      - "scripts/check_tracking_env.py"
      - "configs/bytetrack_person.yaml"
      - "configs/tracklet_stitching.yaml"
      - "tests/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch==2.6.0 torchvision==0.21.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-tracking.txt
      - name: Run tests without model weights
        run: pytest -q -m "not integration"
